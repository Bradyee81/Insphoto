<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>InsPhoto Console</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0d10;
    color: #f4f5f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 16px; }
  h1 { margin: 0; font-size: 22px; }
  p { margin: 0; color: #9aa1a9; }
  button { border: 0; border-radius: 10px; padding: 12px 22px; background: #0F766E; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <!-- The app is a window onto the live console, so it always runs the
       latest version. This page only shows while connecting, or when the
       internet is down — instead of a blank error page. -->
  <div class="wrap">
    <h1>InsPhoto Console</h1>
    <p id="msg">Connecting…</p>
    <button id="retry" hidden>Try again</button>
  </div>
  <script>
    const CONSOLE_URL = "https://insphoto.pages.dev/h/";
    const msg = document.getElementById("msg");
    const retry = document.getElementById("retry");

    async function connect() {
      msg.textContent = "Connecting…";
      retry.hidden = true;
      try {
        const res = await fetch(CONSOLE_URL, { method: "GET", cache: "no-store", mode: "no-cors" });
        if (res) {
          location.replace(CONSOLE_URL);
          return;
        }
      } catch {
        /* offline */
      }
      msg.textContent = "No internet connection. Check the wifi or hotspot, then try again.";
      retry.hidden = false;
      setTimeout(connect, 5000);
    }

    retry.addEventListener("click", connect);
    connect();
  </script>
</body>
</html>
