<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>InsPhoto Admin</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #0b0d10;
    color: #f4f5f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #15181c;
    padding: 32px;
    border-radius: 16px;
    width: 360px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.hint { color: #9aa1a9; font-size: 12px; margin: 0 0 20px; }
  label { display: block; font-size: 12px; color: #9aa1a9; margin-bottom: 14px; }
  input {
    width: 100%;
    margin-top: 4px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #2a2f36;
    background: #1e2227;
    color: #f4f5f6;
    font-size: 14px;
  }
  button {
    width: 100%;
    background: #0F766E;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  #result { margin-top: 16px; font-size: 13px; }
  #result.error { color: #f87171; }
  #result.ok { color: #4ade80; }
  #result a { color: #F59E0B; }
</style>
</head>
<body>
  <div class="card">
    <h1>Create an event</h1>
    <p class="hint">Not a guest/console surface — a one-time bootstrap tool gated by the project's create passcode.</p>
    <form id="form">
      <label>Create passcode<input id="passcode" type="password" required /></label>
      <label>Event slug (e.g. mwta72)<input id="slug" type="text" pattern="[a-z0-9][a-z0-9-]{2,39}" required /></label>
      <label>Event name<input id="name" type="text" required /></label>
      <label>Host PIN<input id="pin" type="text" required minlength="4" /></label>
      <button type="submit">Create event</button>
    </form>
    <div id="result"></div>
  </div>

  <script>
    function apiPath(p) {
      const marker = "/album";
      const idx = location.pathname.indexOf(marker);
      const root = idx === -1 ? "" : location.pathname.slice(0, idx + marker.length);
      return root + p;
    }

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const result = document.getElementById("result");
      result.className = "";
      result.textContent = "Creating…";
      try {
        const res = await fetch(apiPath("/api/admin/events"), {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            passcode: document.getElementById("passcode").value,
            slug: document.getElementById("slug").value.trim(),
            name: document.getElementById("name").value.trim(),
            pin: document.getElementById("pin").value.trim(),
          }),
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body.error || "failed");
        const guestUrl = `${location.origin}${apiPath("/e/" + body.slug)}`;
        const hostUrl = `${location.origin}${apiPath("/h/" + body.slug)}`;
        const ledUrl = `${location.origin}${apiPath("/s/" + body.slug)}`;
        result.className = "ok";
        result.innerHTML = `Created.<br>Guest: <a href="${guestUrl}">${guestUrl}</a><br>Console: <a href="${hostUrl}">${hostUrl}</a><br>LED: <a href="${ledUrl}">${ledUrl}</a>`;
      } catch (err) {
        result.className = "error";
        result.textContent = err.message;
      }
    });
  </script>
</body>
</html>
